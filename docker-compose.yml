version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: nexora_mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexora_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: nexora_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: nexora_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - database

  analytics:
    build:
      context: ./analytics
    container_name: nexora_analytics
    restart: always
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: nexora_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
